<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다시봄 오답노트 – 주소가 바뀌었어요</title>
<meta http-equiv="refresh" content="3; url=https://nami4k.github.io/dasibom/">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f7ff; color: #1d3350;
    font-family: system-ui, 'Noto Sans KR', sans-serif; padding: 0 16px; text-align: center; }
  a { display: inline-block; margin-top: 16px; padding: 14px 22px; border-radius: 16px; background: #2f7fe0; color: #fff; text-decoration: none; font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>오답노트 주소가 바뀌었어요</h1>
  <p>새 주소에서 열고, 거기서 "앱 설치"를 눌러 주세요.</p>
  <a href="https://nami4k.github.io/dasibom/">nami4k.github.io/dasibom 열기</a>
</main>
<script>
  // 예전 주소에 설치된 저장본(서비스 워커)을 지웁니다.
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.includes('/wrong-note/')) r.unregister(); }));
  if (window.caches) caches.keys().then(ks => ks.filter(k => k.startsWith('dasibom-v')).forEach(k => caches.delete(k)));
</script>
</body>
</html>
